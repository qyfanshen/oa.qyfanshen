<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>梵慎集团 OA 系统启动页</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at 15% 20%, #e0f2fe, transparent 40%),
          linear-gradient(135deg, #eff6ff 0%, #f8fafc 55%, #e0f2fe 100%);
      }

      main {
        width: min(420px, 92vw);
        padding: 48px 36px 40px;
        border-radius: 28px;
        background: rgba(255, 255, 255, 0.82);
        box-shadow: 0 24px 50px rgba(15, 118, 166, 0.16);
        border: 1px solid rgba(148, 163, 184, 0.35);
        backdrop-filter: blur(10px);
        text-align: center;
      }

      .logo {
        margin: 0 auto 28px;
        width: 72px;
        height: 72px;
        border-radius: 22px;
        display: grid;
        place-items: center;
        font-size: 30px;
        font-weight: 700;
        color: #0f172a;
        background: linear-gradient(135deg, #38bdf8, #0ea5e9);
        box-shadow: 0 12px 32px rgba(14, 165, 233, 0.42);
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(26px, 4.5vw, 30px);
        color: #0f172a;
        letter-spacing: 0.015em;
      }

      p {
        margin: 0 0 32px;
        font-size: 15px;
        line-height: 1.65;
        color: #475569;
      }

      .actions {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      a.button {
        display: inline-flex;
        justify-content: center;
        align-items: center;
        padding: 14px 18px;
        border-radius: 14px;
        text-decoration: none;
        font-size: 15px;
        font-weight: 600;
        transition: transform 160ms ease, box-shadow 160ms ease;
        background: linear-gradient(135deg, #0284c7, #38bdf8);
        color: #f8fafc;
        box-shadow: 0 16px 28px rgba(2, 132, 199, 0.24);
      }

      a.button:hover {
        transform: translateY(-2px);
        box-shadow: 0 20px 40px rgba(2, 132, 199, 0.28);
      }

      .meta {
        margin-top: 28px;
        font-size: 13px;
        color: #64748b;
      }

      .meta span {
        display: block;
      }

      @media (prefers-reduced-motion: reduce) {
        a.button,
        a.button:hover {
          transition: none;
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="logo">梵</div>
      <h1>梵慎集团 OA 系统</h1>
      <p>
        欢迎使用梵慎集团办公自动化平台。请使用公司发放的账号登录，完成日程审批、费用报销等日常工作任务。
      </p>
      <div class="actions">
        <a class="button" href="/login">进入系统</a>
      </div>
      <div class="meta">
        <span>建议使用最新版 Chrome、Edge 或 Safari 浏览器</span>
        <span>如遇登录问题，请联系信息部支持</span>
      </div>
    </main>
  </body>
</html>
